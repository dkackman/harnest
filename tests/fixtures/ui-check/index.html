<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ui-check fixture</title>
<style>
  .plan-line { color: rgb(20, 20, 20); }
  .plan-line.warn { color: rgb(180, 83, 9); font-weight: 700; }
</style>
</head>
<body>
<main class="plan">
  <h1>Fixture editor</h1>
  <label>Prompt <input type="text" name="prompt"></label>
  <button type="button" id="v">Validate</button>
  <button type="button" id="r">Run</button>
  <button type="button" id="n">Note</button>
  <button type="button" id="d">Delete model</button>
  <button type="button" id="u">Update diffusers</button>
  <button type="button" id="s">Save workflow</button>
  <button type="button" id="pr">Patch request</button>
  <button type="button" id="rr">Again</button>
  <button type="button" id="rb">Restart batch</button>
  <button type="button" id="ld">Load</button>
  <button type="button" id="ls">Listen</button>
  <p class="plan-line">steps: 3</p>
  <p class="plan-line warn" aria-live="polite">estimate: low confidence</p>
  <div id="answer"></div>
  <p id="cross">cross-origin: pending</p>
  <p id="typed">typed: none</p>
  <p id="run">run: none</p>
  <p id="admin">admin: none</p>
  <p id="auth">auth: pending</p>
  <p id="tok">token: none</p>
  <p id="rerun">rerun: none</p>
  <p id="load">load: none</p>
  <p id="events">events: none</p>
  <p id="es">stream: idle</p>
  <p id="width">width: unknown</p>
  <nav class="links" data-area="nav" title="Site links"><a id="doc-link" href="/docs?x=1" title="Open the docs" data-kind="doc" aria-label="Docs" onclick="return false;">Docs link</a></nav>
  <i id="twice">dup one</i><i id="twice">dup two</i><b id="thrice">t1</b><b id="thrice">t2</b><b id="thrice">t3</b>
  <p id="long">aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa!</p>
  <!-- Below the fold, for inspect's in_viewport: "Go far" scrolls it on screen. -->
  <button type="button" id="far-go" onclick="document.getElementById('far').scrollIntoView()">Go far</button>
  <div style="height: 3000px"></div>
  <p id="far">far paragraph</p>
</main>
<script>
  // The bearer token the way dw's UI keeps it (ui/src/lib/token.ts, storage.ts): localStorage
  // "dw-api-token", JSON. The runner puts it there; the page shows it, so the test can see it scrubbed.
  var tok = '';
  try { tok = JSON.parse(localStorage.getItem('dw-api-token') || '""'); } catch (e) {}
  document.getElementById('tok').textContent = 'token: ' + (tok || 'none');
  if (tok) console.error('the token is ' + tok);
  if (tok) { document.getElementById('tok').setAttribute('data-token', tok); window.__token = tok; }
  fetch('/api/validate', { headers: tok ? { Authorization: 'Bearer ' + tok } : {} })
    .then(function (r) { document.getElementById('auth').textContent = 'auth: ' + r.status; },
          function () { document.getElementById('auth').textContent = 'auth: failed'; });
  // A request to another origin (same server, other host name): the runner must abort it.
  var other = location.protocol + '//localhost:' + location.port + '/api/validate';
  fetch(other, { mode: 'no-cors' })
    .then(function () { document.getElementById('cross').textContent = 'cross-origin: reached'; })
    .catch(function () { document.getElementById('cross').textContent = 'cross-origin: blocked'; });
  document.querySelector('input').addEventListener('input', function (e) {
    document.getElementById('typed').textContent = 'typed: ' + e.target.value;
  });
  // POSTs for the record step: a JSON body and a text one (http.server answers 501; the request is what counts)
  document.getElementById('r').addEventListener('click', function () {
    fetch('/api/jobs?sizes=false', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ workflow_path: 'catalog/flux.json', sizes: false }) })
      .then(function (r) { document.getElementById('run').textContent = 'run: answered ' + r.status; },
            function () { document.getElementById('run').textContent = 'run: failed'; })
      .finally(function () { document.getElementById('typed').textContent = 'typed: posted'; });
  });
  // Destructive admin routes (delete_model, update_diffusers, a workflow save): the runner must abort each.
  function admin(id, method, url) {
    document.getElementById(id).addEventListener('click', function () {
      fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: method === 'DELETE' ? undefined : '{}' })
        .then(function (r) { document.getElementById('admin').textContent = 'admin: ' + id + ' answered ' + r.status; },
              function () { document.getElementById('admin').textContent = 'admin: ' + id + ' failed'; });
    });
  }
  admin('d', 'DELETE', '/api/models?repo=org/x');
  admin('u', 'POST', '/api/system/diffusers/update');
  admin('s', 'PUT', '/api/workflows/mine');
  admin('pr', 'PATCH', '/api/workspaces/w/requests/r1');
  // Window flags for window_flag: primitives, and values it must refuse.
  window.__APP_READY = true;
  window.__count = 3;
  window.__label = 'ready';
  window.__nothing = null;
  window.__obj = { a: 1 };
  window.__fn = function () { return 1; };
  window.__long = 'y'.repeat(300);
  // An element with more attributes than inspect reports, one value over 500 chars.
  var many = document.createElement('span');
  many.textContent = 'Many attributes';
  many.setAttribute('title', 'z'.repeat(600));
  for (var k = 0; k < 50; k++) many.setAttribute('data-a' + k, String(k));
  document.querySelector('main').appendChild(many);
  // POST /api/jobs/<id>/rerun (allowed, as rerun_job is) and /rerun-restart-batch (not).
  function post(id, url, out) {
    document.getElementById(id).addEventListener('click', function () {
      fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{"new_seed": true}' })
        .then(function (r) { document.getElementById(out).textContent = out + ': ' + id + ' answered ' + r.status; },
              function () { document.getElementById(out).textContent = out + ': ' + id + ' failed'; });
    });
  }
  post('rr', '/api/jobs/j-7/rerun', 'rerun');
  post('rb', '/api/jobs/j-7/rerun-restart-batch', 'rerun');
  // A page-data GET: shows the status and a field, or that the fetch failed.
  document.getElementById('ld').addEventListener('click', function () {
    fetch('/api/validate').then(function (r) {
      return r.text().then(function (t) {
        var j = {};
        try { j = JSON.parse(t); } catch (e) {}
        document.getElementById('load').textContent = 'load: ' + r.status + ' ' + (j.detail || (j.plan && j.plan.estimate ? j.plan.estimate.basis : '-'));
      });
    }, function () { document.getElementById('load').textContent = 'load: failed'; });
  });
  // An EventSource the way dw's UI follows a job (ui/src/lib/api.ts streamJobEvents): the
  // events it got, by type, and whether it is reconnecting (readyState 0) or gave up (2).
  document.getElementById('ls').addEventListener('click', function () {
    var got = [];
    var src = new EventSource('/api/jobs/j-7/events?after=0');
    var show = function () { document.getElementById('events').textContent = 'events: ' + got.join(' | '); };
    src.onmessage = function (m) { got.push('message:' + m.data + (m.lastEventId ? '#' + m.lastEventId : '')); show(); };
    src.addEventListener('job_status', function (m) { got.push('job_status:' + m.data); show(); });
    src.onerror = function () {
      document.getElementById('es').textContent = 'stream: ' + (src.readyState === 2 ? 'gave up' : 'reconnecting');
    };
  });
  // The viewport width, for the viewport step.
  function width() { document.getElementById('width').textContent = 'width: ' + window.innerWidth; }
  width();
  window.addEventListener('resize', width);
  document.getElementById('n').addEventListener('click', function () {
    fetch('/api/validate?note=1', { method: 'POST', body: 'plain note ' + 'x'.repeat(5000) });
  });
  document.getElementById('v').addEventListener('click', function () {
    fetch('/api/validate').then(function (r) { return r.json(); }).then(function (j) {
      var out = document.getElementById('answer');
      out.textContent = '';
      var lines = [
        'host RAM: ' + (j.plan && j.plan.host_memory ? j.plan.host_memory.projected_mb + ' MB' : 'none'),
        'minutes: ' + (j.plan && j.plan.estimate ? j.plan.estimate.minutes : 'none'),
        'basis: ' + (j.plan && j.plan.estimate ? j.plan.estimate.basis : 'none'),
        'downloads: ' + (j.downloads_required || []).map(function (d) { return d.repo; }).join(', '),
        'valid: ' + j.valid
      ];
      lines.forEach(function (t) { var p = document.createElement('p'); p.className = 'answer-line'; p.textContent = t; out.appendChild(p); });
    });
  });
</script>
</body>
</html>
