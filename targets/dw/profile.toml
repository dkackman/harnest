# The dw target profile (R8/R13): every dw constant the Python drivers
# need, in one place, so harness/ holds no dw literal. Read by
# harness/profile.py. Environment variables still override what they
# always did (DW_TARGET, DW_URL, TICKET_REPO, ...); this file only holds
# the defaults the bash drivers hard-code today.
#
# It grows as drivers are ported. What is here is what the regression
# driver reads; the spec's full field list is in
# docs/superpowers/specs/2026-09-27-r8-port-inputs.md, "The target profile".

product = "diffusers-workflow"
ticket_repo = "dkackman/diffusers-workflow"
harness_repo = "dkackman/harnest"
ticket_owner = "dkackman"
integration_branch = "develop"

[mcp]
name = "dw"
# Server-wide destructive tools no case uses: denied to every consumer.
deny_tools = ["delete_model", "update_diffusers"]
# No token lives in this file, or anywhere in the repo. Each server names
# the env var its Bearer token is read from (token_env); DW_TOKEN is the
# fallback when that one is unset, and with neither set a driver refuses
# to start rather than guess.

[clones]
# ~-relative; a server's clone_suffix is appended to each.
source = "~/src/dkackman/dw-agent"
plugin = "~/src/dkackman/dw-agent-plugin"
plugin_subdir = "plugins/dw"

# One dw deployment per table (harnest#15's "target" is a server here).
# The first one is the primary: its state files carry no suffix, so the
# names a running lem loop already holds never change.
[[servers]]
name = "lem"
host = "lem"
dir = "~/diffusers-workflow"   # the checkout on the host, for the remote shell
backend = "cuda"
port = 8765
token_env = "DW_TOKEN_LEM"
# Regression levels `all` runs on this server.
regression_all = ["smoke", "complete", "model-specific", "security"]
# Cases the driver never hands an agent on this server.
regression_skip_cases = []

[[servers]]
name = "mini-ai"
host = "mini-ai"
dir = "~/diffusers-workflow"
backend = "mps"
port = 8765
token_env = "DW_TOKEN_MINI_AI"
# model-specific loads H3 (~50 GB) and full-size LTX: on a 64 GB unified
# memory machine that is an outage, not a result. It runs only when named.
regression_all = ["smoke", "complete", "security"]
# Each can take a 64 GB unified-memory machine down with the session
# running it (S-F079 SD 1.5 at 8192x8192; C-F005's H3 arm; C-F007 and
# C-F023 near 61 GB of host RSS; C-F047 tens of GB). TARGET_SKIP_CASES
# overrides it.
regression_skip_cases = ["S-F079", "C-F005", "C-F007", "C-F023", "C-F047"]

[suite]
case_id_regex = "[A-Z]+-[A-Z][0-9]+"
contract_runner = "contract/run.py"
contract_cases = "contract/cases"
perf_dir = "regression-perf"

# Regression levels in run order. `implies` runs first, as a prerequisite.
[[suite.levels]]
name = "smoke"
file = "regression-suite-smoke.md"

[[suite.levels]]
name = "complete"
file = "regression-suite-complete.md"
implies = "smoke"

[[suite.levels]]
name = "model-specific"
file = "regression-suite-model-specific.md"

[[suite.levels]]
name = "security"
file = "regression-suite-security.md"
