<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harnest dashboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233b6fd8'/><g fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'><path d='M7.5 13.5A9 9 0 0 1 23 9'/><path d='M24.5 18.5A9 9 0 0 1 9 23'/></g><path d='M25.5 4.5v6.5h-6.5z' fill='%23fff'/><path d='M6.5 27.5v-6.5h6.5z' fill='%23fff'/><circle cx='16' cy='16' r='3.2' fill='%233ccf7a'/></svg>">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --muted: #6b7382; --line: #e2e5ea;
  --ok: #1f9d55; --warn: #c27c0e; --bad: #c9362b; --idle: #9aa1ad; --accent: #3b6fd8;
  --code: #f1f3f6; --tool: #3b6fd8; --result: #8a93a3; --usage: #1f9d55; --hdr: #7b4bc4;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  /* the loop progress chart, bottom of the stack first: an order that passes
     the palette validator's adjacent-pair checks in both modes */
  --s-closed: #1baf7a; --s-other: #eda100; --s-agents: #2a78d6; --s-don: #eb6834;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #1a1e26; --ink: #e3e7ee; --muted: #8d95a3; --line: #2a303b;
    --ok: #3ccf7a; --warn: #e5a53a; --bad: #ef5d50; --idle: #5d6573; --accent: #6f9bff;
    --code: #141820; --tool: #7aa6ff; --result: #6b7483; --usage: #3ccf7a; --hdr: #b48cf2;
    --s-closed: #199e70; --s-other: #c98500; --s-agents: #3987e5; --s-don: #d95926;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px;
  border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
header .spacer { flex: 1; }
header .stamp { color: var(--muted); font-size: 12px; font-family: var(--mono); }
main { padding: 16px 20px; display: grid; gap: 16px; max-width: 1500px; margin: 0 auto; }
.row > * { min-width: 0; }
.row { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  display: flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--idle); display: inline-block; flex: none; }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 1.6s infinite; }
.dot.warn { background: var(--warn); }
.dot.bad { background: var(--bad); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); }
  100% { box-shadow: 0 0 0 7px transparent; } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12.5px;
  display: inline-flex; gap: 6px; align-items: center; background: var(--code); }
.chip b { font-weight: 600; }
.chip.warn { border-color: var(--warn); color: var(--warn); }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.now { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin-bottom: 12px; }
.now dt { color: var(--muted); }
.now dd { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.big { font-size: 17px; font-weight: 650; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.live td { background: color-mix(in srgb, var(--ok) 10%, transparent); }
tr.note td { color: var(--muted); }
td a, .link { color: var(--accent); cursor: pointer; text-decoration: none; }
.scroll { max-height: 340px; overflow: auto; }
#attn .scroll { max-height: 70vh; }
.gates div { font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; }
.gates .pass { color: var(--ok); } .gates .fail { color: var(--bad); }
#logbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
#logbar select, #logbar input { background: var(--code); color: var(--ink); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 13px; }
#logbar input[type=text] { flex: 1; min-width: 180px; }
#logbar label { font-size: 13px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
#log { background: var(--code); border: 1px solid var(--line); border-radius: 8px; height: 520px; overflow: auto;
  font-family: var(--mono); font-size: 12px; line-height: 1.5; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; }
#log .t { color: var(--tool); } #log .r { color: var(--result); } #log .u { color: var(--usage); font-weight: 600; }
#log .h { color: var(--hdr); font-weight: 600; } #log .c { color: var(--result); opacity: .7; }
#log .w { color: var(--bad); }
.empty { color: var(--muted); font-style: italic; }
header button { background: var(--code); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
  padding: 3px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
header button.on { border-color: var(--ok); color: var(--ok); }
#events-card { padding: 8px 16px; }
#events-card summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px;
  font-size: 13px; min-width: 0; }
#events-card summary::-webkit-details-marker { display: none; }
#events-card summary::before { content: "▸"; color: var(--muted); flex: none; }
#events-card[open] summary::before { content: "▾"; }
#events-card summary .lbl { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); flex: none; }
#events-count { background: var(--accent); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 11.5px; flex: none; }
#events-latest { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
#events-card[open] #events-latest { visibility: hidden; }
#events { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow: auto; margin-top: 8px; }
#events div { font-size: 13px; border-left: 3px solid var(--accent); padding: 2px 8px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#events div.fail { border-color: var(--bad); } #events div.pass { border-color: var(--ok); }
#attn table td { vertical-align: top; }
#attn td.title { white-space: normal; width: 100%; }
#attn tr.parked { opacity: .55; }
#attn tr.grp th { padding-top: 10px; color: var(--ink); font-weight: 600; font-family: var(--mono); font-size: 12px; }
#attn tr.grp:first-child th { padding-top: 2px; }
#attn td.stale { color: var(--warn); }
#attn .hidden-note { margin: 6px 0 0; font-size: 12px; }
#attn .tag { font-size: 11.5px; border: 1px solid var(--line); border-radius: 999px; padding: 0 6px;
  color: var(--muted); white-space: nowrap; margin-left: 4px; }
#attn .tag.hot { border-color: var(--warn); color: var(--warn); }
#attn-count { background: var(--warn); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 11.5px;
  text-transform: none; letter-spacing: 0; }
#attn-count.zero { background: var(--idle); }
.prog { margin: 0 0 12px; }
.prog .kpis, .prog .legend { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12.5px; color: var(--muted); }
.prog .kpis { margin-bottom: 4px; }
.prog b { color: var(--ink); font-weight: 600; }
.prog .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.burn { position: relative; height: 130px; margin-top: 4px; }
.burn svg { display: block; }
.burn .grid { stroke: var(--line); stroke-width: 1; }
.burn .hl { fill: var(--code); }
.burn text { fill: var(--muted); font-size: 10.5px; font-family: var(--mono); }
.burn .tip { position: absolute; top: 0; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; font-size: 12px; white-space: nowrap; z-index: 1;
  box-shadow: 0 2px 10px color-mix(in srgb, var(--ink) 15%, transparent); }
.burn .tip div { display: flex; gap: 12px; justify-content: space-between; }
.burn .tip i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
.prog details { margin-top: 4px; font-size: 12.5px; }
.prog summary { cursor: pointer; color: var(--muted); }
.prog ul { margin: 4px 0; padding-left: 18px; max-height: 220px; overflow: auto; }
.prog li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#events time { color: var(--muted); font-family: var(--mono); font-size: 12px; margin-right: 6px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="hdot"></span>
  <h1>harnest</h1>
  <span class="muted" id="hsummary">loading…</span>
  <span class="muted mono" id="hcost" title="spent since each running loop began: every session in its log"></span>
  <a href="/regression" style="color:var(--accent);text-decoration:none;font-size:13px;margin-left:8px">regression →</a>
  <span class="spacer"></span>
  <button id="notify" title="Browser notifications when a driver exits or a gate result lands">🔔 notify</button>
  <span class="stamp" id="stamp"></span>
</header>
<main>
  <section class="card">
    <h2>Running</h2>
    <div class="chips" id="drivers"></div>
  </section>

  <details class="card" id="events-card" hidden>
    <summary><span class="lbl">Events</span><span id="events-count">0</span>
      <span id="events-latest"></span><span class="link" id="events-clear">clear</span></summary>
    <div id="events"></div>
  </details>

  <div class="row" id="targets"></div>

  <div class="row">
    <section class="card">
      <h2>Needs you <span id="attn-count" class="zero">–</span>
        <span class="spacer" style="flex:1"></span>
        <span class="muted" style="text-transform:none;letter-spacing:0"><span id="attn-when"></span> ·
          <span class="link" id="attn-refresh">refresh</span></span></h2>
      <div id="attn"><p class="empty">asking GitHub…</p></div>
    </section>

    <section class="card" id="release-card" hidden>
      <h2>Release gates <span class="muted mono" id="release-file"></span></h2>
      <div class="gates" id="release"></div>
    </section>
  </div>

  <section class="card">
    <h2>Log</h2>
    <div id="logbar">
      <select id="logfile"></select>
      <input type="text" id="filter" placeholder="filter, e.g. [regression:complete.2] or usage:">
      <label><input type="checkbox" id="hidenoise"> hide turns &amp; result sizes</label>
      <label><input type="checkbox" id="follow" checked> follow</label>
    </div>
    <div id="log"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const STATE_MS = 3000, LOG_MS = 2000, MAX_LINES = 4000, MAX_EVENTS = 200;
const LS = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
             set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

function ago(sec) {
  if (sec == null) return "–";
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return sec + "s";
  if (sec < 3600) return Math.floor(sec / 60) + "m " + (sec % 60) + "s";
  return Math.floor(sec / 3600) + "h " + Math.floor(sec % 3600 / 60) + "m";
}
function dur(sec) { return sec == null ? "–" : ago(sec); }
// A header carries a clock time, not a date: the most recent past instance of it
function sinceClock(hms, now) {
  const [h, m, s] = hms.split(":").map(Number);
  const d = new Date(now * 1000); d.setHours(h, m, s, 0);
  let t = d.getTime() / 1000; if (t > now + 60) t -= 86400;
  return now - t;
}

// ---- state -------------------------------------------------------------
async function pollState() {
  try {
    const r = await fetch("/api/state"); const st = await r.json();
    render(st);
    $("stamp").textContent = new Date(st.now * 1000).toLocaleTimeString([], { hour12: false });
  } catch (e) {
    $("hsummary").textContent = "dashboard server unreachable";
    $("hdot").className = "dot bad";
  }
}

// ---- events: a driver exiting, a gate result landing ------------------
let prev = null, unseen = 0;
const BASE_TITLE = document.title;

function events(st) {
  const cur = {
    drivers: new Map(st.drivers.map((d) => [d.pid, `${d.name || `run-${d.driver}.sh`} ${d.args}`.trim()])),
    gates: st.release ? st.release.lines : [],
    attn: st.attention && st.attention.fetched ? new Set(st.attention.items.filter(live).map(attnKey)) : null,
  };
  const out = [];
  if (prev) {
    for (const [pid, name] of prev.drivers)
      if (!cur.drivers.has(pid)) out.push({ text: `${name} finished (pid ${pid})`, cls: "" });
    for (const [pid, name] of cur.drivers)
      if (!prev.drivers.has(pid)) out.push({ text: `${name} started (pid ${pid})`, cls: "" });
    const seen = new Set(prev.gates);
    for (const l of cur.gates)
      if (!seen.has(l) && /: (pass|fail|accepted)\b| (pass|fail) on /.test(l))
        out.push({ text: l, cls: /\bfail/.test(l) ? "fail" : "pass" });
    if (prev.attn && cur.attn)
      for (const i of st.attention.items.filter(live))
        if (!prev.attn.has(attnKey(i))) out.push({ text: `needs you: ${attnKey(i)} ${i.title}`, cls: "" });
  }
  if (prev && !cur.attn) cur.attn = prev.attn;
  prev = cur;
  for (const e of out) announce(e);
}

function announce(e) {
  const when = new Date().toLocaleTimeString([], { hour12: false });
  $("events-card").hidden = false;
  const list = $("events");
  list.insertAdjacentHTML("afterbegin", `<div class="${e.cls}" title="${esc(e.text)}"><time>${when}</time>${esc(e.text)}</div>`);
  while (list.children.length > MAX_EVENTS) list.lastElementChild.remove();
  $("events-count").textContent = list.children.length;
  $("events-latest").textContent = `${when} ${e.text}`;
  if (document.hidden) { unseen++; document.title = `(${unseen}) ${BASE_TITLE}`; }
  if (LS.get("notify", "") === "1" && "Notification" in window && Notification.permission === "granted")
    new Notification("harnest", { body: e.text, tag: e.text });
}

document.addEventListener("visibilitychange", () => { if (!document.hidden) { unseen = 0; document.title = BASE_TITLE; } });
$("events-clear").addEventListener("click", (ev) => {
  ev.preventDefault(); // a click inside <summary> would otherwise toggle it
  $("events").innerHTML = ""; $("events-card").hidden = true; $("events-card").open = false;
});
$("events-card").addEventListener("toggle", () => LS.set("events-open", $("events-card").open ? "1" : ""));
$("events-card").open = LS.get("events-open", "") === "1";

function paintNotify() {
  const on = LS.get("notify", "") === "1" && "Notification" in window && Notification.permission === "granted";
  $("notify").classList.toggle("on", on);
  $("notify").textContent = on ? "🔔 notifying" : "🔕 notify";
}
$("notify").addEventListener("click", async () => {
  if (!("Notification" in window)) { alert("This browser has no notifications."); return; }
  if (LS.get("notify", "") === "1" && Notification.permission === "granted") { LS.set("notify", ""); paintNotify(); return; }
  const p = await Notification.requestPermission();
  LS.set("notify", p === "granted" ? "1" : "");
  paintNotify();
  if (p === "granted") new Notification("harnest", { body: "Notifications on: a driver exiting or a gate result will show here." });
});
paintNotify();

const attnKey = (i) => i.repo === "advisory" ? i.number : `${i.repo}#${i.number}`;
// parked, or blocked by an open issue: nothing to act on, so not shown
const live = (i) => !i.tags.includes("parked") && !i.waiting.length;
const HOT = /^(release-blocker|release|status:needs-approval|status:plan-review|status:needs-info|critical|high)$/;
const hot = (i) => i.tags.some((t) => HOT.test(t));
const REPOS = ["dw", "harnest", "advisory"]; // group order
const STALE_SECS = 3 * 86400; // no activity this long: the age turns amber
let lastAttn = null;

function renderAttention(a) {
  if (!a) return;
  $("attn-when").textContent = a.busy ? "checking GitHub…"
    : a.held_until ? `rate limited · next check in ${ago(a.held_until - Date.now() / 1000)}`
    : a.fetched ? `checked ${ago(Date.now() / 1000 - a.fetched)} ago` : "not checked yet";
  if (!a.fetched) return;
  lastAttn = a;
  const all = LS.get("attn-all", "") === "1";
  const acting = a.items.filter(live), hidden = a.items.length - acting.length;
  // by repo; in each, what to act on, urgent first, then the most recently touched
  const items = (all ? [...a.items] : acting).sort((x, y) => REPOS.indexOf(x.repo) - REPOS.indexOf(y.repo)
    || live(y) - live(x) || hot(y) - hot(x) || String(y.updated).localeCompare(String(x.updated)));
  $("attn-count").textContent = acting.length;
  $("attn-count").className = acting.length ? "" : "zero";
  $("attn-count").title = `${acting.length} to act on, ${hidden} parked or waiting on another issue`;
  const errs = a.errors.map((e) => `<p class="w" style="color:var(--bad);margin:4px 0">${esc(e)}</p>`).join("");
  const now = Date.now() / 1000;
  let rows = "", repo = null;
  for (const i of items) {
    if (i.repo !== repo) {
      repo = i.repo;
      rows += `<tr class="grp"><th colspan="3">${esc(repo)} <span class="muted">${acting.filter((x) => x.repo === repo).length}</span></th></tr>`;
    }
    const age = i.updated ? now - Date.parse(i.updated) / 1000 : null;
    rows += `<tr class="${live(i) ? "" : "parked"}">
      <td class="mono"><a href="${esc(i.url)}" target="_blank" rel="noopener" title="${esc(i.number)}">${i.repo === "advisory" ? esc(String(i.number).slice(0, 9)) + "…" : "#" + i.number}</a></td>
      <td class="title">${esc(i.title)}${i.tags.map((t) => `<span class="tag ${HOT.test(t) ? "hot" : ""}">${esc(t.replace(/^status:/, ""))}</span>`).join("")}${i.waiting.length ? `<span class="tag">waiting on ${i.waiting.map((b) =>
        `<a href="${esc(b.url)}" target="_blank" rel="noopener">#${b.number}</a>`).join(", ")}</span>` : ""}</td>
      <td class="num ${age > STALE_SECS ? "stale" : "muted"}" title="last activity ${age == null ? "unknown" : ago(age) + " ago"}">${age == null ? ""
        : age >= 2 * 86400 ? `${Math.floor(age / 86400)}d ${Math.floor(age % 86400 / 3600)}h` : ago(age).replace(/ \d+s$/, "")}</td></tr>`;
  }
  keepScroll($("attn"), () => {
    $("attn").innerHTML = errs + (items.length ? `<div class="scroll"><table>${rows}</table></div>`
      : '<p class="empty">nothing waiting on you</p>')
      + (hidden ? `<p class="muted hidden-note">${hidden} parked or waiting on another issue ·
          <span class="link" id="attn-all">${all ? "hide" : "show"}</span></p>` : "");
  });
}
$("attn").addEventListener("click", (e) => {
  if (e.target.id !== "attn-all") return;
  LS.set("attn-all", LS.get("attn-all", "") === "1" ? "" : "1");
  renderAttention(lastAttn);
});
// A redraw replaces a panel's tables: keep where each was scrolled to
function keepScroll(el, draw) {
  const tops = [...el.querySelectorAll(".scroll, .prog ul")].map((x) => x.scrollTop);
  draw();
  el.querySelectorAll(".scroll, .prog ul").forEach((x, n) => { if (tops[n]) x.scrollTop = tops[n]; });
}
$("attn-refresh").addEventListener("click", async () => {
  $("attn-when").textContent = "checking GitHub…";
  try { await fetch("/api/attention"); } catch {}
  setTimeout(pollState, 2500);
});

function render(st) {
  events(st);
  renderAttention(st.attention);
  // drivers
  const d = st.drivers;
  $("drivers").innerHTML = d.length ? d.map((x) =>
    `<span class="chip"><span class="dot ok"></span><b>${esc(x.name || `run-${x.driver}.sh`)}</b> ${esc(x.args)}
     ${x.local ? '<span class="muted">· mac</span>' : ""}
     ${x.parent ? `<span class="muted">· under ${x.parent}</span>` : ""}
     <span class="muted mono">pid ${x.pid} · ${esc(x.elapsed)}</span></span>`).join("")
    + `<span class="chip"><span class="muted">claude -p sessions</span> <b>${st.claude_sessions}</b></span>`
    : '<span class="empty">no drivers running</span>';
  for (const f of st.stop_flags)
    $("drivers").insertAdjacentHTML("beforeend", `<span class="chip warn">⚑ logs/${esc(f)}</span>`);

  // targets
  let anyLive = false, summary = [];
  keepScroll($("targets"), () => $("targets").innerHTML = Object.entries(st.streams).map(([name, s]) => {
    const quiet = s.mtime ? st.now - s.mtime : null;
    const held = s.lock && s.lock.alive;
    const sessions = s.sessions.filter((x) => x.turns || x.usage || x.model);
    const cur = sessions[sessions.length - 1];
    const running = held && cur && !cur.usage;
    const cls = running && quiet < 180 ? "ok" : held ? "warn" : s.lock ? "bad" : "";
    if (running) { anyLive = true; summary.push(`${name}: ${cur.tag}`); }
    const lockTxt = s.lock ? (s.lock.alive ? `held by ${esc(s.lock.owner)}` : `stale (${esc(s.lock.owner)})`) : "free";
    let now = "";
    if (cur) {
      const el = running ? ago(sinceClock(cur.time, st.now)) : dur(cur.usage && cur.usage.duration);
      now = `<dl class="now">
        <dt>${running ? "now" : "last"}</dt><dd><span class="big">${esc(cur.tag)}</span>
          <span class="muted">${esc(cur.model || "")}</span></dd>
        <dt>${running ? "running" : "took"}</dt><dd>${el} · ${cur.turns} turns · ctx ${esc(cur.ctx || "–")}
          ${cur.usage ? ` · $${cur.usage.cost.toFixed(2)}` : ""}</dd>
        <dt>tool</dt><dd class="mono" title="${esc(cur.last_tool)}">${esc(cur.last_tool || "–")}</dd>
        <dt>said</dt><dd title="${esc(cur.last_line)}">${esc(cur.last_line || "–")}</dd>
        ${s.run ? `<dt>run</dt><dd class="muted" title="${esc(s.run.label)}">${esc(s.run.time)} ${esc(s.run.label)}</dd>` : ""}
      </dl>`;
    }
    const rows = sessions.slice(-25).reverse();
    const total = rows.reduce((a, x) => a + (x.usage ? x.usage.cost : 0), 0);
    return `<section class="card">
      <h2><span class="dot ${cls}"></span>${esc(name)} <span class="muted mono">${esc(s.file)}</span>
        <span class="spacer" style="flex:1"></span>
        <span class="muted" style="text-transform:none;letter-spacing:0">lock ${lockTxt} · last write ${quiet == null ? "never" : ago(quiet) + " ago"}</span></h2>
      ${now || '<p class="empty">no sessions in this log</p>'}
      ${progress(name, s.loop_run)}
      <div class="scroll"><table>
        <tr><th>start</th><th>session</th><th>model</th><th class="num">turns</th><th class="num">time</th><th class="num">ctx peak</th><th class="num">cost</th></tr>
        ${rows.map((x) => `<tr class="${x === cur && running ? "live" : ""}">
          <td class="mono">${esc(x.time)}</td>
          <td><a data-file="${esc(s.file)}" data-tag="${esc(x.tag)}">${esc(x.tag)}</a></td>
          <td class="muted">${esc((x.model || "").replace(/^claude-/, ""))}</td>
          <td class="num">${x.usage ? x.usage.turns : x.turns}</td>
          <td class="num">${x.usage ? dur(x.usage.duration) : (x === cur && running ? "…" : "–")}</td>
          <td class="num">${esc(x.usage ? x.usage.ctx_peak : x.ctx || "–")}</td>
          <td class="num">${x.usage ? "$" + x.usage.cost.toFixed(2) : "–"}</td></tr>`).join("")}
        <tr><td></td><td class="muted">last ${rows.length} sessions</td><td></td><td></td><td></td><td></td>
          <td class="num"><b>$${total.toFixed(2)}</b></td></tr>
      </table></div>
    </section>`;
  }).join(""));
  document.querySelectorAll(".burn").forEach(drawBurn);
  const runs = Object.values(st.streams).filter((s) => s.loop_run);
  $("hcost").textContent = runs.length ? `· $${runs.reduce((a, s) => a + s.loop_run.cost, 0).toFixed(2)} this run` : "";

  // release
  const rel = st.release;
  $("release-card").hidden = !rel;
  if (rel) {
    $("release-file").textContent = "logs/" + rel.file;
    $("release").innerHTML = rel.lines.map((l) =>
      `<div class="${/\bpass\b|success/.test(l) ? "pass" : /\bfail|failure/.test(l) ? "fail" : ""}">${esc(l)}</div>`).join("");
  }

  $("hdot").className = "dot " + (anyLive ? "ok" : d.length ? "warn" : "");
  $("hsummary").textContent = anyLive ? summary.join("  ·  ") : d.length ? "drivers running, no session live" : "idle";
}

// ---- loop progress: the board after each cycle, as a burn-up ----------
// Each column is one cycle's board that differed from the last: the tickets
// closed since the run began, under the ones still open by owner. Its height
// is every ticket the run has seen, so tickets filed mid-run raise it.
const SERIES = [ // bottom of the stack first (the --s-* order)
  { key: "closed", label: "closed", css: "--s-closed" },
  { key: "other", label: "other owner", css: "--s-other" },
  { key: "agents", label: "with agents", css: "--s-agents" },
  { key: "don", label: "waiting on you", css: "--s-don" },
  { key: "parked", label: "parked", css: "--idle" }, // recessive: nothing will move it
];
const burns = {}, burnHover = {}, openLists = new Set();
// other and parked only when some board had one (a board logged before the parked mark has none)
const seriesOf = (lr) => SERIES.filter((x) => !["other", "parked"].includes(x.key) || lr.points.some((p) => p[x.key]));

function progress(name, lr) {
  delete burns[name];
  if (!lr || !lr.points.length) return "";
  burns[name] = lr;
  const last = lr.points[lr.points.length - 1];
  const item = (i) => `<li><a href="https://github.com/${esc(lr.repo)}/issues/${i.number}" target="_blank" rel="noopener">#${i.number}</a>
    ${esc(i.title)}${i.open === false ? ' <span class="muted">· closed</span>' : ""}</li>`;
  const list = (key, label, items) => items.length ? `<details data-list="${esc(name)}:${key}" ${openLists.has(`${name}:${key}`) ? "open" : ""}>
    <summary>${items.length} ${label}</summary><ul>${items.map(item).join("")}</ul></details>` : "";
  return `<div class="prog">
    <div class="kpis"><span>loop since <b>${esc(lr.start)}</b></span><span>cycle <b>${lr.cycle}</b></span>
      <span><b>${lr.closed.length}</b> closed</span><span><b>${lr.arrived.length}</b> arrived</span>
      <span><b>${lr.sessions}</b> sessions · <b>$${lr.cost.toFixed(2)}</b></span></div>
    <div class="legend">${seriesOf(lr).slice().reverse().map((x) =>
      `<span><i style="background:var(${x.css})"></i>${x.label} <b>${last[x.key] || 0}</b></span>`).join("")}</div>
    <div class="burn" data-stream="${esc(name)}" role="img"
      aria-label="${esc(`${lr.points.length} boards since ${lr.start}: ${last.closed} closed, ${last.agents} with agents, ${last.don} waiting on you`)}"></div>
    ${list("closed", "closed or left the board this run", lr.closed)}
    ${list("arrived", "arrived this run", lr.arrived)}
  </div>`;
}

function niceStep(max) { // a 1/2/5 step giving at most four gridlines
  const mag = 10 ** Math.floor(Math.log10(max));
  return [1, 2, 5, 10].map((m) => m * mag).find((st) => max / st <= 4);
}

function drawBurn(el) {
  const name = el.dataset.stream, lr = burns[name];
  if (!lr) return;
  const pts = lr.points, series = seriesOf(lr);
  const W = el.clientWidth, H = el.clientHeight, L = 26, R = 2, T = 6, B = 16;
  const pw = W - L - R, ph = H - T - B;
  const tot = (p) => series.reduce((a, x) => a + (p[x.key] || 0), 0);
  const step = niceStep(Math.max(1, ...pts.map(tot)));
  const top = Math.ceil(Math.max(1, ...pts.map(tot)) / step) * step;
  const y = (v) => T + ph - v / top * ph;
  const slot = pw / pts.length, bw = Math.max(1, Math.min(24, slot - 2));
  let svg = "";
  for (let v = 0; v <= top; v += step)
    svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v) + .5}" y2="${y(v) + .5}"/>
      <text x="${L - 5}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`;
  const hov = burnHover[name];
  pts.forEach((p, i) => {
    const x = L + i * slot + (slot - bw) / 2;
    if (i === hov) svg += `<rect class="hl" x="${L + i * slot}" y="${T}" width="${slot}" height="${ph}"/>`;
    const segs = series.filter((s) => p[s.key] > 0);
    let acc = 0;
    segs.forEach((s, n) => {
      const y0 = y(acc), y1 = y(acc += p[s.key]);
      const h = y0 - y1 - (n ? 2 : 0); // a 2px surface gap under every segment but the first
      if (h <= 0) return;
      const r = n === segs.length - 1 && bw >= 8 ? Math.min(4, h, bw / 2) : 0; // rounded data end
      svg += `<path fill="var(${s.css})" d="M${x},${y1 + h}V${y1 + r}${r ? `Q${x},${y1} ${x + r},${y1}` : ""}H${x + bw - r}${r ? `Q${x + bw},${y1} ${x + bw},${y1 + r}` : ""}V${y1 + h}Z"/>`;
    });
  });
  const lbl = (p) => `c${p.cycle} ${p.time.slice(0, 5)}`;
  svg += `<text x="${L}" y="${H - 3}">${lbl(pts[0])}</text>`;
  if (pts.length > 1) svg += `<text x="${W - R}" y="${H - 3}" text-anchor="end">${lbl(pts[pts.length - 1])}</text>`;
  pts.forEach((_, i) => svg += `<rect data-i="${i}" x="${L + i * slot}" y="0" width="${slot}" height="${H}" fill="transparent"/>`);
  el.innerHTML = `<svg width="${W}" height="${H}">${svg}</svg>`;
  if (hov != null && pts[hov]) {
    const p = pts[hov];
    el.insertAdjacentHTML("beforeend", `<div class="tip"><b>cycle ${p.cycle} · ${esc(p.time)}</b>
      ${series.slice().reverse().map((x) => `<div><span><i style="background:var(${x.css})"></i>${x.label}</span><b>${p[x.key] || 0}</b></div>`).join("")}
      <div class="muted"><span>arrived since ${esc(lr.start)}</span><span>${p.arrived}</span></div></div>`);
    const tip = el.lastElementChild, cx = L + (hov + .5) * slot;
    tip.style.left = Math.max(0, Math.min(W - tip.offsetWidth, cx < W / 2 ? cx + 12 : cx - 12 - tip.offsetWidth)) + "px";
  }
}

$("targets").addEventListener("mousemove", (e) => {
  const hit = e.target.closest(".burn [data-i]"); if (!hit) return;
  const el = hit.closest(".burn"), i = +hit.dataset.i;
  if (burnHover[el.dataset.stream] !== i) { burnHover[el.dataset.stream] = i; drawBurn(el); }
});
$("targets").addEventListener("mouseout", (e) => {
  const el = e.target.closest(".burn");
  if (el && !el.contains(e.relatedTarget)) { delete burnHover[el.dataset.stream]; drawBurn(el); }
});
// <details> don't bubble toggle; the redraw every poll keeps the open ones open
$("targets").addEventListener("toggle", (e) => {
  const k = e.target.dataset && e.target.dataset.list; if (!k) return;
  e.target.open ? openLists.add(k) : openLists.delete(k);
}, true);
window.addEventListener("resize", () => document.querySelectorAll(".burn").forEach(drawBurn));

$("targets").addEventListener("click", (e) => {
  const a = e.target.closest("a[data-tag]"); if (!a) return;
  $("filter").value = "[" + a.dataset.tag + "]";
  if ($("logfile").value !== a.dataset.file) { $("logfile").value = a.dataset.file; resetLog(); } else redrawLog();
  $("log").scrollIntoView({ behavior: "smooth", block: "start" });
});

// ---- log ---------------------------------------------------------------
let logOffset = -1, logLines = [], logBusy = false;

async function loadFiles() {
  const files = await (await fetch("/api/logs")).json();
  const sel = $("logfile"), keep = sel.value || LS.get("file", "loop.log");
  sel.innerHTML = files.map((f) => `<option value="${esc(f.name)}">${esc(f.name)}  (${(f.size / 1024).toFixed(0)} KB)</option>`).join("");
  if (files.some((f) => f.name === keep)) sel.value = keep;
}

function resetLog() { logOffset = -1; logLines = []; $("log").innerHTML = ""; LS.set("file", $("logfile").value); pollLog(); }

function classify(line) {
  if (line.startsWith("=== ")) return "h";
  const rest = line.replace(/^\[[^\]]+\] /, "");
  if (rest.startsWith("> ")) return "t";
  if (rest.startsWith("< ")) return "r";
  if (rest.startsWith("usage:")) return "u";
  if (rest.startsWith("· ctx=")) return "c";
  if (/\[audit\] WARNING|ERROR|Traceback|error:/.test(line)) return "w";
  return "";
}
function visible(line) {
  const f = $("filter").value.trim();
  if ($("hidenoise").checked && /^\[[^\]]+\] (· ctx=|< \d+ chars)/.test(line)) return false;
  return !f || line.includes(f);
}
function lineHTML(l) { const c = classify(l); return c ? `<span class="${c}">${esc(l)}</span>\n` : esc(l) + "\n"; }

function redrawLog() {
  const el = $("log");
  const shown = logLines.filter(visible);
  el.innerHTML = shown.length ? shown.map(lineHTML).join("") : '<span class="empty">no matching lines in the loaded tail</span>';
  if ($("follow").checked) el.scrollTop = el.scrollHeight;
}

async function pollLog() {
  if (logBusy) return; logBusy = true;
  const file = $("logfile").value;
  try {
    if (!file) return;
    const r = await (await fetch(`/api/log?file=${encodeURIComponent(file)}&offset=${logOffset}`)).json();
    if (file !== $("logfile").value || r.error) return;
    if (r.size < logOffset) { logOffset = -1; logLines = []; return; } // truncated or rotated
    logOffset = r.offset;
    if (!r.text) return;
    const fresh = r.text.replace(/\n$/, "").split("\n");
    const el = $("log");
    const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
    logLines.push(...fresh);
    if (logLines.length > MAX_LINES) { logLines = logLines.slice(-MAX_LINES); redrawLog(); }
    else {
      if (el.querySelector(".empty")) el.innerHTML = "";
      el.insertAdjacentHTML("beforeend", fresh.filter(visible).map(lineHTML).join(""));
      if ($("follow").checked && atBottom) el.scrollTop = el.scrollHeight;
    }
  } catch (e) { /* the next poll retries */ }
  finally { logBusy = false; }
}

$("logfile").addEventListener("change", resetLog);
$("filter").addEventListener("input", () => { LS.set("filter", $("filter").value); redrawLog(); });
$("hidenoise").addEventListener("change", () => { LS.set("noise", $("hidenoise").checked ? "1" : ""); redrawLog(); });
$("follow").addEventListener("change", () => { if ($("follow").checked) $("log").scrollTop = $("log").scrollHeight; });
$("filter").value = LS.get("filter", "");
$("hidenoise").checked = LS.get("noise", "1") === "1";

(async () => {
  await loadFiles(); pollState(); resetLog();
  setInterval(pollState, STATE_MS);
  setInterval(pollLog, LOG_MS);
  setInterval(loadFiles, 30000);
})();
</script>
</body>
</html>
